# ==================== JVM ====================
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# ==================== Производительность ====================
org.gradle.parallel=true
org.gradle.caching=true

# ==================== AndroidX ====================
android.useAndroidX=true
android.nonTransitiveRClass=true

# ==================== Kotlin ====================
kotlin.code.style=official
kotlin.incremental=true

# AGP 9: разрешить KSP использовать kotlin.sourceSets для генерации кода
android.disallowKotlinSourceSets=false

# ==================== ПРОКСИ (ОБЯЗАТЕЛЬНО!) ====================
systemProp.http.proxyHost=172.20.20.8
systemProp.http.proxyPort=8080
systemProp.https.proxyHost=172.20.20.8
systemProp.https.proxyPort=8080